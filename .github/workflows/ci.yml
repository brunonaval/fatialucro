name: Windows installer (manual)

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Gerar instalador Windows (selecione feat/pricing-engine-v01 em Use workflow from)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: windows-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' && inputs.build_windows == true && github.ref == 'refs/heads/feat/pricing-engine-v01'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Select Rust stable MSVC
        shell: pwsh
        run: rustup default stable-msvc
      - run: npm ci
      - name: Build Windows installer on GitHub
        run: npm run tauri -- build --ci -- --locked
      - uses: actions/upload-artifact@v7
        with:
          name: FatiaLucro-windows-x64-review
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 3
