[package]
name = "fatialucro"
version = "0.1.0"
description = "Calculadora offline de precificacao para impressao 3D"
authors = ["FatiaLucro contributors"]
edition = "2021"
license = "MIT"
rust-version = "1.77.2"

[lib]
name = "fatialucro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
