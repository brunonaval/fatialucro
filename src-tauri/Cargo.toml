[package]
name = "fatialucro"
version = "0.3.0"
description = "Calculadora offline de precificacao para impressao 3D"
authors = ["FatiaLucro contributors"]
edition = "2021"
license = "MIT"
rust-version = "1.90.0"

[lib]
name = "fatialucro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
signed-updater = ["dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tauri-plugin-updater = { version = "=2.14.1", optional = true }
